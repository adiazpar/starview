{% load account_forms %}
{{ attrs.form.non_field_errors }}
{% for field in attrs.form %}
  {% if field.is_hidden %}
    {{ field }}
    {{ field.errors }}
  {% else %}
    <div class="form-group">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field|account_widget }}
      {{ field.errors }}
      {% if field.help_text %}<p id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
    </div>
  {% endif %}
{% endfor %}
